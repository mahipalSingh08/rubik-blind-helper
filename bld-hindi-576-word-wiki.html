<title>576 हिंदी Letter-Pair Word Wiki</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--accent:#ff8a3d;--accent2:#4dd0e1;--text:#eef0f4;--muted:#8a8fa3}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,'Noto Sans Devanagari',Arial,sans-serif;background:radial-gradient(circle at top,#1c2030 0%,#0f1117 60%);color:var(--text);min-height:100vh;padding:26px 14px 60px}
h1{text-align:center;font-size:1.45rem;margin:0 0 4px}
.sub{text-align:center;color:var(--muted);font-size:.88rem;margin:0 0 20px}
.bar{max-width:640px;margin:0 auto 14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#q{flex:1 1 260px;padding:11px 14px;border-radius:10px;border:1px solid #2b3040;background:#10131c;color:var(--text);font-size:1.1rem;text-align:center}
button{padding:9px 16px;border-radius:8px;border:1px solid #333a4d;background:#262b3a;color:var(--text);cursor:pointer;font-size:.85rem}
button.on{background:linear-gradient(135deg,var(--accent),#ff6f3d);color:#17130c;border:none;font-weight:700}
.chips{max-width:900px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips button{min-width:40px;font-size:1.05rem;padding:6px 10px}
.info{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;max-width:1200px;margin:0 auto}
.card{background:var(--panel);border:1px solid #262b3a;border-radius:10px;padding:10px 12px}
.card.dbl{border-color:rgba(255,138,61,.55);background:#1d1a15}
.tag{font-weight:800;font-size:1.15rem;letter-spacing:3px;color:var(--accent2)}
.dbl .tag{color:var(--accent)}
.card input{width:100%;margin-top:4px;padding:4px 6px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text);font-size:1rem;font-weight:700}
.card input:focus{outline:none;border-color:var(--accent);background:#10131c}
.mean{font-size:.74rem;color:var(--muted);padding-left:6px}
.note{font-size:.66rem;color:var(--accent);padding-left:6px;margin-top:3px;font-weight:600}
.edited input{color:#4dd27a}
.hidden{display:none!important}
</style>

const KEY="bldHindiWordWiki";
let edits={};
try{edits=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){edits={}}
let editMode=false, firstFilter=null;
const grid=document.getElementById("grid"), info=document.getElementById("info"), q=document.getElementById("q");
function save(){try{localStorage.setItem(KEY,JSON.stringify(edits))}catch(e){}}
function build(){
  grid.innerHTML="";
  DATA.letters.forEach(a=>DATA.letters.forEach(b=>{
    const p=a+b, base=DATA.pairs[p];
    const w=edits[p]!==undefined?edits[p]:base[0];
    const c=document.createElement("div");
    c.className="card"+(a===b?" dbl":"")+(edits[p]!==undefined?" edited":"");
    c.dataset.p=p;
    c.innerHTML='<div class="tag">'+p+'</div>';
    const inp=document.createElement("input");
    inp.value=w; inp.readOnly=!editMode; inp.spellcheck=false;
    inp.addEventListener("change",()=>{
      const v=inp.value.trim();
      if(v===""||v===base[0]){delete edits[p];inp.value=base[0];c.classList.remove("edited")}
      else{edits[p]=v;c.classList.add("edited")}
      save();
    });
    c.appendChild(inp);
    const m=document.createElement("div");m.className="mean";m.textContent=base[1];c.appendChild(m);
    if(a===b){const n=document.createElement("div");n.className="note";n.textContent="same letter twice = flipped edge / twisted corner";c.appendChild(n)}
    c.dataset.search=(p+" "+base[0]+" "+base[1]).toLowerCase();
    grid.appendChild(c);
  }));
  apply();
}
function apply(){
  const s=q.value.trim().toLowerCase(); let n=0;
  document.querySelectorAll(".card").forEach(c=>{
    let ok=true;
    if(firstFilter&&c.dataset.p[0]!==firstFilter)ok=false;
    if(ok&&s){ok=c.dataset.search.includes(s)||c.querySelector("input").value.toLowerCase().includes(s)}
    c.classList.toggle("hidden",!ok); if(ok)n++;
  });
  info.textContent="Showing "+n+" of 576 pairs"+(Object.keys(edits).length?" · "+Object.keys(edits).length+" edited by you":"");
}
const chips=document.getElementById("chips");
const all=document.createElement("button");all.textContent="सभी";all.className="on";chips.appendChild(all);
function setChip(btn,l){firstFilter=l;chips.querySelectorAll("button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");apply()}
all.onclick=()=>setChip(all,null);
DATA.letters.forEach(l=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>setChip(b,l);chips.appendChild(b)});
q.addEventListener("input",apply);
document.getElementById("editToggle").onclick=function(){
  editMode=!editMode;this.textContent="✏️ Edit mode: "+(editMode?"ON":"OFF");this.classList.toggle("on",editMode);
  document.querySelectorAll(".card input").forEach(i=>i.readOnly=!editMode);
};
