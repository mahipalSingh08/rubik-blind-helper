<div class="tab-container">
  <h1>🧊 2D Cube Speffz Visualizer</h1>
  <p class="subtitle">Standard lettering scheme (U-L-F-R-B-D)</p>

  <div class="cube-grid">
    <!-- Empty top left -->
    <div class="empty"></div>
    <!-- U Face -->
    <div class="face-wrapper">
      <div class="face-title">U (Up)</div>
      <div class="face u-face">
        <div class="sticker tl corner">A</div><div class="sticker t edge">A</div><div class="sticker tr corner">B</div>
        <div class="sticker l edge">D</div><div class="sticker c center">U</div><div class="sticker r edge">B</div>
        <div class="sticker bl corner">D</div><div class="sticker b edge">C</div><div class="sticker br corner">C</div>
      </div>
    </div>
    <!-- Empty top right x2 -->
    <div class="empty"></div><div class="empty"></div>

    <!-- Middle row: L, F, R, B -->
    <div class="face-wrapper">
      <div class="face-title">L (Left)</div>
      <div class="face l-face">
        <div class="sticker tl corner">E</div><div class="sticker t edge">E</div><div class="sticker tr corner">F</div>
        <div class="sticker l edge">H</div><div class="sticker c center">L</div><div class="sticker r edge">F</div>
        <div class="sticker bl corner">H</div><div class="sticker b edge">G</div><div class="sticker br corner">G</div>
      </div>
    </div>
    <div class="face-wrapper">
      <div class="face-title">F (Front)</div>
      <div class="face f-face">
        <div class="sticker tl corner">I</div><div class="sticker t edge">I</div><div class="sticker tr corner">J</div>
        <div class="sticker l edge">L</div><div class="sticker c center">F</div><div class="sticker r edge">J</div>
        <div class="sticker bl corner">L</div><div class="sticker b edge">K</div><div class="sticker br corner">K</div>
      </div>
    </div>
    <div class="face-wrapper">
      <div class="face-title">R (Right)</div>
      <div class="face r-face">
        <div class="sticker tl corner">M</div><div class="sticker t edge">M</div><div class="sticker tr corner">N</div>
        <div class="sticker l edge">P</div><div class="sticker c center">R</div><div class="sticker r edge">N</div>
        <div class="sticker bl corner">P</div><div class="sticker b edge">O</div><div class="sticker br corner">O</div>
      </div>
    </div>
    <div class="face-wrapper">
      <div class="face-title">B (Back)</div>
      <div class="face b-face">
        <div class="sticker tl corner">Q</div><div class="sticker t edge">Q</div><div class="sticker tr corner">R</div>
        <div class="sticker l edge">T</div><div class="sticker c center">B</div><div class="sticker r edge">R</div>
        <div class="sticker bl corner">T</div><div class="sticker b edge">S</div><div class="sticker br corner">S</div>
      </div>
    </div>

    <!-- Bottom row: D -->
    <div class="empty"></div>
    <div class="face-wrapper">
      <div class="face-title">D (Down)</div>
      <div class="face d-face">
        <div class="sticker tl corner">U</div><div class="sticker t edge">U</div><div class="sticker tr corner">V</div>
        <div class="sticker l edge">X</div><div class="sticker c center">D</div><div class="sticker r edge">V</div>
        <div class="sticker bl corner">X</div><div class="sticker b edge">W</div><div class="sticker br corner">W</div>
      </div>
    </div>
    <div class="empty"></div><div class="empty"></div>
  </div>
</div>
